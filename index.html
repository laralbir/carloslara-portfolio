  <!-- Anti-FOUC Theme & Language Flash Prevention Script -->
  <script>
    (function() {
      try {
        var setting = localStorage.getItem('user_theme') || 'light';
        var isDark = setting === 'dark';
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');

        var a11y = localStorage.getItem('user_contrast');
        if (a11y === 'high') {
          document.documentElement.setAttribute('data-a11y', 'high-contrast');
          document.documentElement.classList.add('a11y-contrast');
        }
        
        var lang = localStorage.getItem('user_lang');
        if (!lang) {
          var bl = (navigator.language || (navigator.languages && navigator.languages[0]) || '').toLowerCase();
          if (bl.startsWith('es')) {
            lang = 'es';
          } else if (bl.startsWith('ca') || bl.startsWith('va')) {
            lang = 'va';
          } else {
            lang = 'en';
          }
        }
        document.documentElement.lang = lang === 'va' ? 'ca-ES' : lang;
      } catch (e) {}
    })();
  </script>
