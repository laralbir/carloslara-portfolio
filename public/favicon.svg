<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Brand Teal to Cyan gradient (Light browser theme) -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bba7"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glowing Teal to Sky Cyan gradient (Dark browser theme) -->
    <linearGradient id="brand-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bba7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <style>
    /* Default: Light Browser Tab */
    .favicon-bg {
      fill: url(#brand-grad);
      stroke: none;
    }
    .favicon-text {
      fill: #ffffff;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: -1px;
    }
    .favicon-badge {
      fill: #38bdf8;
    }

    /* Dynamic Adaptation: Dark Browser Tab */
    @media (prefers-color-scheme: dark) {
      .favicon-bg {
        fill: #0b0f19;
        stroke: #00bba7;
        stroke-width: 5;
      }
      .favicon-text {
        fill: url(#brand-teal);
      }
      .favicon-badge {
        fill: #00bba7;
      }
    }
  </style>

  <rect class="favicon-bg" x="3" y="3" width="94" height="94" rx="22"/>
  <text class="favicon-text" x="48" y="66" text-anchor="middle">CL</text>
  <circle class="favicon-badge" cx="78" cy="27" r="7"/>
</svg>
