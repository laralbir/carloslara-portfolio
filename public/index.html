<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carlos Lara Albir — En Construcción</title>
  <meta name="description" content="Portfolio personal de Carlos Lara Albir. Sitio web actualmente en construcción.">
  <meta name="theme-color" content="#090d16">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.15);
      --badge-bg: rgba(59, 130, 246, 0.1);
      --badge-border: rgba(59, 130, 246, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image: 
        radial-gradient(ellipse at 50% 20%, rgba(59, 130, 246, 0.12), transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(30, 58, 138, 0.08), transparent 40%);
    }

    .container {
      max-width: 540px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      font-size: 0.8125rem;
      font-weight: 500;
      color: #93c5fd;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      border-radius: 9999px;
      margin-bottom: 1.5rem;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #60a5fa;
      border-radius: 50%;
      box-shadow: 0 0 8px #60a5fa;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.4;
        transform: scale(0.85);
      }
    }

    .avatar {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      border-radius: 1rem;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }

    p.subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .status-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.12);
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      font-size: 0.875rem;
      color: #cbd5e1;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="badge">
      <span class="pulse-dot"></span>
      En desarrollo activo
    </div>

    <div class="avatar" aria-hidden="true">CL</div>

    <h1>Carlos Lara Albir</h1>
    <p class="subtitle">
      Mi nuevo sitio web y portfolio profesional está en construcción. Próximamente disponible.
    </p>

    <div class="status-box">
      🚀 Construido bajo metodología <strong>Spec Driven Development (SDD)</strong> y alojado en la red global de <strong>Cloudflare</strong>.
    </div>

    <footer>
      &copy; 2026 Carlos Lara Albir. Todos los derechos reservados.
    </footer>
  </main>
</body>
</html>
